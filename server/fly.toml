# Fly.io — from server/:  fly launch --copy-config --no-deploy && fly secrets set DATABASE_URL=... JWT_SECRET=... && fly deploy
app = "pixeltopia-server"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  PG_DRIVER = "pg"
  SHARD_COUNT = "2"
  MAX_CONN_PER_SHARD = "150"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
